# Configuration for catalogify.
# Copy to .okf-config.yml in your repo root (or leave defaults).

okf:
  # Where the knowledge bundle lives, relative to the repo root.
  bundle_dir: "knowledge"

  # Declared OKF version, written into the bundle-root index.md frontmatter.
  okf_version: "0.1"

  # Base URL used to build `resource:` URIs for concepts bound to source
  # files. {path} is replaced with the repo-relative file path.
  # Leave empty to auto-detect from `git remote get-url origin`.
  resource_base: ""   # e.g. "https://github.com/acme/shop/blob/main/{path}"

  # Paths (glob) to exclude from the inventory scan and bundle validation.
  # Honored directly by okf-inventory.sh and validate_okf.py (pass
  # --config <this file> to either script) — not just prompt guidance.
  exclude:
    - "node_modules/**"
    - ".git/**"
    - "dist/**"
    - "build/**"
    - "vendor/**"
    - "**/*.min.js"
    - ".specify/**"
    - "specs/**"

  # Mapping hints from artifact kinds to OKF `type` values. The agent may
  # introduce additional descriptive types; consumers must tolerate unknown
  # types per OKF §4.1, so this list is guidance, not a closed taxonomy.
  types:
    service: "Service"
    module: "Module"
    api_endpoint: "API Endpoint"
    cli_command: "CLI Command"
    data_model: "Data Model"
    database_table: "Database Table"
    config: "Configuration"
    pipeline: "Pipeline"
    metric: "Metric"
    playbook: "Playbook"
    decision: "Design Decision"
    reference: "Reference"

  # Bundle layout: top-level subdirectories the generator organizes
  # concepts into. Directories with no concepts are omitted.
  layout:
    - "architecture"   # system overview, design decisions
    - "services"       # deployable units / apps
    - "modules"        # significant packages / libraries within the code
    - "apis"           # endpoints, schemas, contracts
    - "data"           # tables, models, migrations
    - "operations"     # playbooks, runbooks, pipelines, configs
    - "references"     # mirrored external material

  # Existing concept-coverage behavior. Leave unchanged unless you explicitly
  # need to tune the legacy coverage setting.
  granularity: "medium"

  # Detail controls how deeply each selected concept is explained. An explicit
  # "detail: detailed" request in the current prompt overrides this default
  # for that run; otherwise this value is used.
  # "default"  = existing catalogify behavior.
  # "detailed" = deeper interfaces, dependencies, history, gotchas and
  #              answerable open questions, without changing concept coverage.
  detail: "default"

  # clarify workflow behavior.
  clarify:
    # Max questions to ask the user in a single clarify run (the rest are
    # deferred to a later run) — keeps clarification from spamming the user.
    max_questions: 20
